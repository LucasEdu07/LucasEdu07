<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Lucas Eduardo — Software Engineer, Applied AI and Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#0C1524"/>
      <stop offset="100%" stop-color="#0A0F18"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0A63C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E0A63C" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E0A63C" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#233043"/>
    </pattern>

    <clipPath id="frame">
      <rect x="0" y="0" width="1280" height="320" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)" opacity="0.55"/>

    <!-- camadas de sistema, em perspectiva: a metafora do trabalho (stack que se sustenta) -->
    <g transform="translate(872 56)" opacity="0.92">
      <g fill="none" stroke-width="1.5">
        <path d="M0 176 L150 106 L300 176 L150 246 Z" stroke="#2C3B52" fill="#111A2A"/>
        <path d="M0 132 L150  62 L300 132 L150 202 Z" stroke="#35506F" fill="#12203A"/>
        <path d="M0  88 L150  18 L300  88 L150 158 Z" stroke="#3E6289" fill="#15294A"/>
        <path d="M0  44 L150 -26 L300  44 L150 114 Z" stroke="#E0A63C" fill="#1A2E4F"/>
      </g>
      <circle cx="150" cy="44" r="4.5" fill="#E0A63C">
        <animate attributeName="opacity" values="1;0.25;1" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="132" r="3" fill="#4C79A8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="220" r="3" fill="#4C79A8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- barra de acento -->
    <rect x="80" y="96" width="4" height="86" rx="2" fill="#E0A63C"/>

    <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="112" y="132" fill="#E9EFF7" font-size="52" font-weight="700" letter-spacing="-1.2">Lucas Eduardo</text>
      <text x="114" y="172" fill="#8FA3BC" font-size="21" font-weight="500" letter-spacing="0.3">Software Engineer · Applied AI &amp; Platform</text>

      <text x="114" y="228" font-size="14.5" font-weight="600" letter-spacing="1.8" fill="#6F8399"><tspan>TYPESCRIPT</tspan><tspan fill="#33455C" dx="9">·</tspan><tspan fill="#6F8399" dx="9">PYTHON</tspan><tspan fill="#33455C" dx="9">·</tspan><tspan fill="#6F8399" dx="9">KOTLIN</tspan><tspan fill="#33455C" dx="9">·</tspan><tspan fill="#6F8399" dx="9">C#</tspan><tspan fill="#33455C" dx="9">·</tspan><tspan fill="#6F8399" dx="9">POSTGRES</tspan><tspan fill="#33455C" dx="9">·</tspan><tspan fill="#6F8399" dx="9">DOCKER</tspan></text>
    </g>

    <!-- linha de base com varredura lenta -->
    <rect x="112" y="258" width="560" height="1" fill="#1E2B3E"/>
    <rect x="112" y="257.5" width="180" height="2" fill="url(#sweep)">
      <animate attributeName="x" values="112;492;112" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
