<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Lucas Eduardo — Software Engineer, Applied AI and Platform">
  <defs>
    <linearGradient id="bgl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBFCFD"/>
      <stop offset="55%" stop-color="#F3F6F9"/>
      <stop offset="100%" stop-color="#EDF1F5"/>
    </linearGradient>

    <linearGradient id="sweepl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9A6E14" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9A6E14" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9A6E14" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dotsl" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#D4DCE5"/>
    </pattern>

    <clipPath id="framel">
      <rect x="0" y="0" width="1280" height="320" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#framel)">
    <rect width="1280" height="320" fill="url(#bgl)"/>
    <rect width="1280" height="320" fill="url(#dotsl)" opacity="0.8"/>

    <g transform="translate(872 56)" opacity="0.95">
      <g fill="none" stroke-width="1.5">
        <path d="M0 176 L150 106 L300 176 L150 246 Z" stroke="#C3CEDB" fill="#EAEFF5"/>
        <path d="M0 132 L150  62 L300 132 L150 202 Z" stroke="#A7BCD3" fill="#E1EAF4"/>
        <path d="M0  88 L150  18 L300  88 L150 158 Z" stroke="#7F9DBD" fill="#D7E4F2"/>
        <path d="M0  44 L150 -26 L300  44 L150 114 Z" stroke="#9A6E14" fill="#CCDDEF"/>
      </g>
      <circle cx="150" cy="44" r="4.5" fill="#9A6E14">
        <animate attributeName="opacity" values="1;0.25;1" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="132" r="3" fill="#5C7FA6">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="220" r="3" fill="#5C7FA6">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="80" y="96" width="4" height="86" rx="2" fill="#9A6E14"/>

    <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="112" y="132" fill="#12181F" font-size="52" font-weight="700" letter-spacing="-1.2">Lucas Eduardo</text>
      <text x="114" y="172" fill="#4B5A6B" font-size="21" font-weight="500" letter-spacing="0.3">Software Engineer · Applied AI &amp; Platform</text>

      <text x="114" y="228" font-size="14.5" font-weight="600" letter-spacing="1.8" fill="#64748B"><tspan>TYPESCRIPT</tspan><tspan fill="#B6C2CF" dx="9">·</tspan><tspan fill="#64748B" dx="9">PYTHON</tspan><tspan fill="#B6C2CF" dx="9">·</tspan><tspan fill="#64748B" dx="9">KOTLIN</tspan><tspan fill="#B6C2CF" dx="9">·</tspan><tspan fill="#64748B" dx="9">C#</tspan><tspan fill="#B6C2CF" dx="9">·</tspan><tspan fill="#64748B" dx="9">POSTGRES</tspan><tspan fill="#B6C2CF" dx="9">·</tspan><tspan fill="#64748B" dx="9">DOCKER</tspan></text>
    </g>

    <rect x="112" y="258" width="560" height="1" fill="#D4DCE5"/>
    <rect x="112" y="257.5" width="180" height="2" fill="url(#sweepl)">
      <animate attributeName="x" values="112;492;112" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
